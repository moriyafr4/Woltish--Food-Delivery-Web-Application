services:
  mongo:
    image: mongo:7
    command: ["mongod", "--quiet"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data


  web-server:
    build:
      context: ./restaurants-web-server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - RECOMMENDATION_SERVER_HOST=server
      - RECOMMENDATION_SERVER_PORT=8080
      - MONGODB_URI=mongodb://mongo:27017/restaurants
    volumes:
      - ./restaurants-web-server/src/uploads:/usr/src/app/src/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/restaurants"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      mongo:
        condition: service_healthy
      server:
        condition: service_started

  web-client:
    build:
      context: ./restaurants-web-client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    
    stdin_open: true
    tty: true
    depends_on:
      web-server:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    depends_on:
      server:
        condition: service_started
    stdin_open: true
    tty: true

  tests:
    build:
      context: .
      dockerfile: Dockerfile.server
    command: ["./build/run_tests"]
    volumes:
      - ./data:/app/data

volumes:
  mongo-data: